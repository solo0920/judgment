[project]
name = "judgment"
version = "0.1.0"
description = "Judgment RAG backend modules"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<0.29",
  "pyarrow>=15,<19",
  "SQLAlchemy>=2.0,<2.1",
  "psycopg[binary]>=3.1,<3.3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
  "duckdb>=1.4.5",
  "psutil>=5.9,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<0.9",
]

[project.scripts]
judgment-import-judgments = "judgment.judgment_import:main"
judgment-index-vectors = "judgment.judgment_index:main"
judgment-law-download = "judgment.law_download.cli:main"
judgment-backfill-law-articles = "judgment.law_article_versions:main"
judgment-normalize-courts = "judgment.court_normalize:main"
judgment-power-agent = "judgment.web.power_agent:main"
judgment-web = "judgment.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judgment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
